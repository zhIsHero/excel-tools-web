<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>生成排课配置</title>
    <style>
      body { margin: 0; background: #f4f6fa; color: #182230; font: 16px/1.5 "Microsoft YaHei", sans-serif; }
      main { max-width: 560px; margin: 7vh auto; padding: 28px; background: white; border-radius: 16px; box-shadow: 0 12px 40px #18223016; }
      h1 { margin: 0 0 8px; font-size: 26px; }
      p { color: #596579; }
      label { display: block; margin: 18px 0; font-weight: 600; }
      input[type="password"] { display: block; width: 100%; box-sizing: border-box; margin-top: 7px; padding: 11px; border: 1px solid #b9c3d1; border-radius: 8px; font: inherit; }
      .switch { display: flex; gap: 10px; align-items: center; }
      .switch input { width: 20px; height: 20px; }
      button { padding: 11px 18px; border: 0; border-radius: 8px; background: #1769e0; color: white; font: inherit; cursor: pointer; }
      #status { min-height: 48px; margin-top: 18px; white-space: pre-wrap; }
      a { color: #1769e0; }
    </style>
  </head>
  <body>
    <main>
      <a href="/">返回百宝箱</a>
      <h1>生成排课配置</h1>
      <p>设置开关和密码后，下载配置文件，用它替换网页工程中的 <code>public/scheduler-access.json</code>，然后重新部署帽子云。网站不会自动保存改动。</p>
      <form id="adminForm">
        <label class="switch"><input id="enabled" type="checkbox" />允许排课</label>
        <label>新排课密码（只改开关时留空）<input id="newPassword" type="password" autocomplete="new-password" /></label>
        <label>确认新密码<input id="confirmPassword" type="password" autocomplete="new-password" /></label>
        <button type="submit">下载配置文件</button>
      </form>
      <div id="status" role="status" aria-live="polite"></div>
      <a id="downloadLink" download="scheduler-access.json" hidden>点击下载 scheduler-access.json</a>
      <noscript>请启用浏览器 JavaScript 后生成配置。</noscript>
      <p>密码只在本机浏览器中生成摘要，不会上传明文。任何人都能打开本页生成文件，只有能重新部署网站的人才能让配置生效。</p>
    </main>
    <script defer src="./scheduler-admin.js"></script>
  </body>
</html>
